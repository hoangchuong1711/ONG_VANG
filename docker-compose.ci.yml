# Standalone test stack: do not combine with docker-compose.yml using multiple -f flags.
name: mini-ong-vang-ci

services:
  db-test:
    image: postgres:17
    environment:
      POSTGRES_DB: mini_ong_vang_test
      POSTGRES_USER: mini_ong_vang_test
      POSTGRES_PASSWORD: ci-only-password
    ports:
      - "127.0.0.1:15433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mini_ong_vang_test -d mini_ong_vang_test"]
      interval: 2s
      timeout: 5s
      retries: 30

  backend-test:
    image: mini-ong-vang-backend-test:local
    build:
      context: ./src/backend
    environment:
      DB_URL: jdbc:postgresql://db-test:5432/mini_ong_vang_test
      DB_USER: mini_ong_vang_test
      DB_PASSWORD: ci-only-password
    ports:
      - "127.0.0.1:18081:8080"
    depends_on:
      db-test:
        condition: service_healthy
