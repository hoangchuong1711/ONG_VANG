name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_URL: http://localhost:18081
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend tests and API smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: mini-ong-vang-ci
      TEST_DB_URL: jdbc:sqlserver://127.0.0.1:15433;databaseName=mini_ong_vang_design_v2_test;encrypt=true;trustServerCertificate=true
      TEST_DB_USER: sa
      REQUIRE_TEST_DB: 'true'
      API_BASE_URL: http://127.0.0.1:18081
      API_EXPECTED_DATABASE: mini_ong_vang_design_v2_test
      V2_SMOKE_PASSWORD: '12345678'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: src/backend/pom.xml
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/api/package-lock.json
      - name: Install API tools without rewriting committed vendor files
        run: npm ci --ignore-scripts --prefix tools/api
      - name: Validate contract, examples, Postman and CSRF tests
        run: npm run check --prefix tools/api
      - name: Generate disposable SQL Server credentials
        run: echo "TEST_DB_PASSWORD=Aa!$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: Validate isolated Compose configuration
        run: docker compose -f docker-compose.ci.yml config --quiet
      - name: Start isolated SQL Server 2022
        run: |
          docker compose -f docker-compose.ci.yml up --wait --wait-timeout 180 db-test
          docker compose -f docker-compose.ci.yml up --no-deps --exit-code-from db-init-test db-init-test
      - name: Build WAR and run Java tests against test database
        run: mvn --batch-mode --no-transfer-progress -f src/backend/pom.xml verify
      - name: Seed isolated DesignV2 HTTP smoke fixtures
        run: |
          docker compose -f docker-compose.ci.yml cp src/backend/src/main/resources/db/designV2/sqlserver/demo/V9__insert_demo_data.sql db-test:/tmp/designv2-V9.sql
          docker compose -f docker-compose.ci.yml cp src/backend/src/main/resources/db/designV2/sqlserver/demo/V10__update_demo_credentials_and_positions.sql db-test:/tmp/designv2-V10.sql
          docker compose -f docker-compose.ci.yml cp src/backend/src/main/resources/db/designV2/sqlserver/demo/V11__fix_demo_account_password_hash.sql db-test:/tmp/designv2-V11.sql
          docker compose -f docker-compose.ci.yml cp src/backend/src/main/resources/db/designV2/sqlserver/demo/V17__restore_demo_password_hash.sql db-test:/tmp/designv2-V17.sql
          docker compose -f docker-compose.ci.yml cp src/backend/src/main/resources/db/designV2/sqlserver/demo/V18__seed_demo_operating_config.sql db-test:/tmp/designv2-V18.sql
          docker compose -f docker-compose.ci.yml cp src/backend/src/main/resources/db/designV2/sqlserver/demo/V19__change_demo_account_password.sql db-test:/tmp/designv2-V19.sql
          docker compose -f docker-compose.ci.yml exec -T db-test /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -I -b -d mini_ong_vang_design_v2_test -i /tmp/designv2-V9.sql
          docker compose -f docker-compose.ci.yml exec -T db-test /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -I -b -d mini_ong_vang_design_v2_test -i /tmp/designv2-V10.sql
          docker compose -f docker-compose.ci.yml exec -T db-test /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -I -b -d mini_ong_vang_design_v2_test -i /tmp/designv2-V11.sql
          docker compose -f docker-compose.ci.yml exec -T db-test /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -I -b -d mini_ong_vang_design_v2_test -i /tmp/designv2-V17.sql
          docker compose -f docker-compose.ci.yml exec -T db-test /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -I -b -d mini_ong_vang_design_v2_test -i /tmp/designv2-V18.sql
          docker compose -f docker-compose.ci.yml exec -T db-test /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -I -b -d mini_ong_vang_design_v2_test -i /tmp/designv2-V19.sql
      - name: Start DesignV2 backend after database tests finish
        run: docker compose -f docker-compose.ci.yml up --build --wait --wait-timeout 120 backend-test
      - name: Wait for DesignV2 API readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 "$API_BASE_URL/api/health" > /dev/null; then
              echo "DesignV2 API ready after attempt $attempt"
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.ci.yml logs --tail=100 backend-test
          exit 1
      - name: Smoke test DesignV2 admin directories
        run: python tools/api/design-v2-admin-directory-smoke.py --base "$API_BASE_URL" --expected-database "$API_EXPECTED_DATABASE"
      - name: Smoke test DesignV2 admin orders and incidents
        run: python tools/api/design-v2-admin-ops-smoke.py --base "$API_BASE_URL"
      - name: Smoke test DesignV2 finance and Excel reports
        run: python tools/api/design-v2-admin-finance-smoke.py --base "$API_BASE_URL"
      - name: Verify V20 removes only legacy demo fixtures
        run: |
          docker compose -f docker-compose.ci.yml cp src/backend/src/main/resources/db/designV2/sqlserver/demo/V20__remove_legacy_demo_orders.sql db-test:/tmp/designv2-V20.sql
          docker compose -f docker-compose.ci.yml exec -T db-test /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -I -b -d mini_ong_vang_design_v2_test -i /tmp/designv2-V20.sql
          docker compose -f docker-compose.ci.yml exec -T db-test /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -I -b -d mini_ong_vang_design_v2_test -Q "IF (SELECT COUNT(*) FROM dbo.tai_khoan) <> 8 THROW 52420, 'Demo accounts were not preserved', 1; IF EXISTS (SELECT 1 FROM dbo.don_hang WHERE CONVERT(VARCHAR(36), ma_don) LIKE '50000000-0000-0000-0000-%') THROW 52421, 'Legacy demo orders remain', 1; IF EXISTS (SELECT 1 FROM dbo.giao_dich_nop_tien WHERE CONVERT(VARCHAR(36), ma_giao_dich) LIKE '80000000-0000-0000-0000-%') THROW 52422, 'Legacy demo payments remain', 1;"
      - name: Collect container logs
        if: always()
        run: |
          mkdir -p test-results
          docker compose -f docker-compose.ci.yml logs --no-color > test-results/compose.log 2>&1
      - name: Upload test reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            src/backend/target/surefire-reports/
            test-results/
          if-no-files-found: warn
          retention-days: 7
      - name: Stop isolated environment
        if: always()
        run: docker compose -f docker-compose.ci.yml down --volumes --remove-orphans
